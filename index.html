/* Layout: una sola columna de móvil, cuatro pestañas + resumen semanal; modo oscuro fijo azul-tinta con acento dorado. */
:root{
  --bg:#000000; --surface:#0a0a0a; --surface2:#141414; --line:#3a3a3a;
  --fg:#ffffff; --muted:#a8a8a8; --title:#9c2229; --accent:#e8b65a; --accent-ink:#1a1305;
  --ok:#5cc39a; --warn:#e8845a; --info:#6aa6ff;
  --f-display:'Cuadrada',ui-sans-serif,system-ui,sans-serif; --f-body:'Cuadrada',ui-sans-serif,system-ui,-apple-system,sans-serif; --f-mono:'Cuadrada',ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg);min-height:100%}
body{margin:0;min-height:100vh}
body{color:var(--fg);font:13px/1.65 var(--f-body);letter-spacing:.01em;-webkit-text-size-adjust:100%;padding-block:env(safe-area-inset-top,0px) calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-top:14px}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:800;letter-spacing:.02em;text-wrap:balance;color:var(--title)}
h2{font-size:18px}h3{font-size:15px}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:11px}
.eyebrow{font-family:var(--f-display);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:22px}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
.datebar button{width:40px;height:40px;border-radius:10px;color:var(--fg);display:grid;place-items:center}
.datebar button:active{background:var(--surface2)}
.datebar .mid{text-align:center;flex:1;min-width:0}
.datebar .mid b::first-letter{text-transform:uppercase}
.datebar .mid b{display:block;font-weight:700;font-family:var(--f-display);font-size:13px}
.datebar .mid a{font-size:10px;color:var(--accent);cursor:pointer}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.flat{background:transparent}
.verse{background:var(--surface);position:relative}
.verse q{quotes:none;font-family:var(--f-display);font-style:normal;font-weight:500;font-size:15px;line-height:1.7;text-wrap:pretty}
.verse cite{font-style:normal;color:var(--accent);font-size:13px;letter-spacing:.04em}

.banner{display:flex;gap:12px;align-items:center;border-radius:14px;padding:12px 14px;border:1px solid}
.banner.todo{background:rgba(232,132,90,.1);border-color:rgba(232,132,90,.45)}
.banner.done{background:rgba(92,195,154,.08);border-color:rgba(92,195,154,.35)}
.banner .t{flex:1;min-width:0}
.banner b{display:block}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-display);font-size:10px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.on{color:var(--ok);border-color:rgba(92,195,154,.5);background:rgba(92,195,154,.08)}

/* forms */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:10px;color:var(--muted)}
.in{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding-right:10px;min-width:0}
.in em{font-style:normal;font-size:10px;color:var(--muted)}
input,textarea,select{font:inherit;font-size:16px;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.in input{border:0;background:transparent;font-family:var(--f-mono)}
textarea{resize:vertical;min-height:96px;line-height:1.45}
::placeholder{color:#707070}
.btn{font-family:var(--f-display);font-size:13px;letter-spacing:.03em;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:var(--surface2);color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn.sm{min-height:36px;padding:0 12px;font-size:12px;border-radius:10px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.sp{flex:1}

/* progress */
.prog{display:flex;flex-direction:column;gap:5px}
.pl{display:flex;justify-content:space-between;gap:8px;font-size:11px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--info);border-radius:99px}
.bar.ok i{background:var(--ok)}

/* gym */
.ex{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.ex .hint{font-size:10px;color:var(--muted)}
.setrow{display:grid;grid-template-columns:22px 1fr 1fr 1fr 34px;gap:6px;align-items:center}
.setrow.hd span{font-family:var(--f-display);font-size:9px;letter-spacing:.1em;color:var(--muted);text-align:center;text-transform:uppercase}
.setrow .n{font-family:var(--f-mono);color:var(--muted);text-align:center;font-size:11px}
.setrow input{font-family:var(--f-mono);text-align:center;padding:9px 2px;font-size:15px}
.x{width:36px;height:36px;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.x:active{background:var(--surface2)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{font-family:var(--f-display);font-size:11px;letter-spacing:.04em;padding:10px 0;border-radius:9px;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--accent)}
.btnchip{background:none;cursor:pointer;min-height:34px;padding:0 12px;color:var(--fg)}
.btnchip.on{color:var(--accent);border-color:rgba(232,182,90,.6);background:rgba(232,182,90,.08)}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ms{display:flex;flex-direction:column;gap:2px;min-width:0}
.ms b{font-family:var(--f-mono);font-size:15px;font-weight:700}
.ms span{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--f-display)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.timer{display:flex;flex-direction:column;gap:10px}
.timer .big{font-family:var(--f-mono);font-size:28px;font-weight:500;letter-spacing:.02em}
.rest.done .big{color:var(--ok)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .nm{flex:1;min-width:0;overflow-wrap:anywhere}
details.hist{border-top:1px solid var(--line);padding:10px 0}
details.hist summary{cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
details.hist summary::-webkit-details-marker{display:none}
details.hist .body{padding-top:10px;display:flex;flex-direction:column;gap:10px}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.fb{background:var(--surface2);border-radius:12px;padding:12px;border-left:3px solid var(--accent)}
.thumb{max-height:180px;border-radius:10px;border:1px solid var(--line)}

/* week */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-mono);font-size:17px;font-weight:500}
.stat .v small{font-size:10px;color:var(--muted);font-weight:400}
.delta{font-size:10px;color:var(--muted);font-family:var(--f-mono)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:9px var(--f-mono)}
.chart .bar-r{fill:var(--accent)}
.chart .bar-m{fill:#6b6b6b}
.chart .bar-u{fill:none;stroke:var(--muted);stroke-width:1}
.chart .goal{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .dot{fill:var(--bg);stroke:var(--accent);stroke-width:2}
.chart .grid{stroke:var(--line);stroke-width:1}
.obs ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.empty{color:var(--muted);font-size:14px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(0,0,0,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in2{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{font-family:var(--f-display);letter-spacing:.03em;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;color:var(--muted);font-size:9px;min-height:48px}
nav.tabs button.on{color:var(--accent)}
nav.tabs svg{width:22px;height:22px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.sbox{width:100%;max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sbox textarea{min-height:200px;font-family:var(--f-mono)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw}
.toast[hidden]{display:none}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Secciones"><div class="in2" id="nav"></div></nav>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
'use strict';

/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const monday=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const todayStr=()=>ymd(new Date());
const fmtN=(x,dec=0)=>x==null||isNaN(x)?'—':Number(x).toLocaleString('es-MX',{maximumFractionDigits:dec});
const longDate=s=>parse(s).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
const shortDate=s=>parse(s).toLocaleDateString('es-MX',{day:'numeric',month:'short'});
const num=v=>typeof v==='number'&&!isNaN(v)?v:null;
const avg=a=>{a=a.filter(v=>v!=null);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
const sum=a=>a.reduce((x,y)=>x+(y||0),0);
const clone=o=>JSON.parse(JSON.stringify(o));
const mmss=s=>pad(Math.floor(s/60))+':'+pad(s%60);

/* ---------- versículos (Reina-Valera 1960) ---------- */
const VERSES=[
['Todo lo puedo en Cristo que me fortalece.','Filipenses 4:13'],
['Mira que te mando que te esfuerces y seas valiente; no temas ni desmayes, porque Jehová tu Dios estará contigo en dondequiera que vayas.','Josué 1:9'],
['Encomienda a Jehová tus obras, y tus pensamientos serán afirmados.','Proverbios 16:3'],
['Y todo lo que hagáis, hacedlo de corazón, como para el Señor y no para los hombres.','Colosenses 3:23'],
['Pero los que esperan a Jehová tendrán nuevas fuerzas; levantarán alas como las águilas; correrán, y no se cansarán; caminarán, y no se fatigarán.','Isaías 40:31'],
['¿O ignoráis que vuestro cuerpo es templo del Espíritu Santo, el cual está en vosotros, el cual tenéis de Dios, y que no sois vuestros?','1 Corintios 6:19'],
['Por demás es que os levantéis de madrugada, y veléis tarde, y comáis pan de dolores; pues que a su amado dará Dios el sueño.','Salmo 127:2'],
['En paz me acostaré, y asimismo dormiré; porque solo tú, Jehová, me haces vivir confiado.','Salmo 4:8'],
['Sabiduría ante todo; adquiere sabiduría; y sobre todas tus posesiones adquiere inteligencia.','Proverbios 4:7'],
['Porque Jehová da la sabiduría, y de su boca viene el conocimiento y la inteligencia.','Proverbios 2:6'],
['Y si alguno de vosotros tiene falta de sabiduría, pídala a Dios, el cual da a todos abundantemente y sin reproche, y le será dada.','Santiago 1:5'],
['No nos cansemos, pues, de hacer bien; porque a su tiempo segaremos, si no desmayamos.','Gálatas 6:9'],
['Porque no nos ha dado Dios espíritu de cobardía, sino de poder, de amor y de dominio propio.','2 Timoteo 1:7'],
['Corramos con paciencia la carrera que tenemos por delante.','Hebreos 12:1'],
['Lámpara es a mis pies tu palabra, y lumbrera a mi camino.','Salmo 119:105'],
['Fíate de Jehová de todo tu corazón, y no te apoyes en tu propia prudencia. Reconócelo en todos tus caminos, y él enderezará tus veredas.','Proverbios 3:5-6'],
['Mas buscad primeramente el reino de Dios y su justicia, y todas estas cosas os serán añadidas.','Mateo 6:33'],
['Dios es nuestro amparo y fortaleza, nuestro pronto auxilio en las tribulaciones.','Salmo 46:1'],
['No temas, porque yo estoy contigo; no desmayes, porque yo soy tu Dios que te esfuerzo; siempre te ayudaré, siempre te sustentaré con la diestra de mi justicia.','Isaías 41:10'],
['En lo que requiere diligencia, no perezosos; fervientes en espíritu, sirviendo al Señor.','Romanos 12:11'],
['Enséñanos de tal modo a contar nuestros días, que traigamos al corazón sabiduría.','Salmo 90:12'],
['La mano negligente empobrece; mas la mano de los diligentes enriquece.','Proverbios 10:4'],
['Los pensamientos del diligente ciertamente tienden a la abundancia.','Proverbios 21:5'],
['Encomienda a Jehová tu camino, y confía en él; y él hará.','Salmo 37:5'],
['Por la misericordia de Jehová no hemos sido consumidos, porque nunca decayeron sus misericordias. Nuevas son cada mañana; grande es tu fidelidad.','Lamentaciones 3:22-23'],
['Prosigo a la meta, al premio del supremo llamamiento de Dios en Cristo Jesús.','Filipenses 3:14'],
['El ejercicio corporal para poco es provechoso, pero la piedad para todo aprovecha, pues tiene promesa de esta vida presente, y de la venidera.','1 Timoteo 4:8'],
['Te alabaré; porque formidables, maravillosas son tus obras; estoy maravillado, y mi alma lo conoce mucho.','Salmo 139:14'],
['A estos cuatro muchachos Dios les dio conocimiento e inteligencia en todas las letras y ciencia.','Daniel 1:17']
];
const verseFor=s=>{const d=parse(s);const doy=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);return VERSES[doy%VERSES.length]};

/* ---------- estado ---------- */
const DEF_CFG={kcal:2200,protein:130,steps:10000,sleep:8,study:3,subjects:[],routines:[]};
const S={days:{},workouts:{},study:{},med:{},weeks:{},cfg:{...DEF_CFG},
  date:todayStr(),tab:'hoy',gymView:'sesion',progSel:null,weekSel:monday(todayStr()),loaded:0,offline:false,error:''};
const TOTAL_SUBS=6;
let db=null;
const medDraft={topic:'',source:'',explanation:'',image:null};
const medUI={err:'',open:null};

/* ---------- escritura ---------- */
const queues={};
function queue(path,fn){
  const prev=queues[path]||Promise.resolve();
  queues[path]=prev.then(fn).catch(e=>{console.error(e);toast('No se pudo guardar: '+(e&&e.code||'error'))});
  return queues[path];
}
function saveDoc(coll,id){ return queue(coll+'/'+id,()=>db.doc(coll+'/'+id).set(clone(S[coll][id]))); }
function patchDay(date,patch){ S.days[date]={date,...(S.days[date]||{}),...patch}; return saveDoc('days',date); }
function saveCfg(){ return queue('config/main',()=>db.doc('config/main').set(clone(S.cfg))); }

/* ---------- toast ---------- */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* ---------- temporizadores ---------- */
const T={restEnd:0,restTotal:0,audio:null};
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function beep(){
  try{
    const c=T.audio; if(!c)return;
    [0,0.35,0.7].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);
      g.gain.setValueAtTime(0.0001,c.currentTime+t);g.gain.exponentialRampToValueAtTime(0.3,c.currentTime+t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t+0.25);
      o.start(c.currentTime+t);o.stop(c.currentTime+t+0.3)});
  }catch(e){}
}
function tick(){
  const r=$('#restTxt'),box=$('#restBox');
  if(T.restEnd){
    const left=Math.max(0,Math.ceil((T.restEnd-Date.now())/1000));
    if(r)r.textContent=mmss(left);
    if(left===0){T.restEnd=0;beep();if(box)box.classList.add('done');toast('Descanso terminado')}
  }else if(r&&!(box&&box.classList.contains('done')))r.textContent='00:00';
  const sw=lsGet('velez.sw'),el=$('#swTxt');
  if(el)el.textContent=sw?mmss(Math.floor((Date.now()-sw.start)/1000)):'00:00';
}
setInterval(tick,250);

/* ---------- cálculos ---------- */
const sessionOf=d=>S.workouts[d];
const studyHours=d=>sum(((S.study[d]||{}).entries||[]).map(e=>e.hours));
const medOn=d=>Object.entries(S.med).filter(([id,m])=>m.date===d).map(([id,m])=>({id,...m}));
function medStreak(){
  let d=todayStr(),n=0;
  if(!medOn(d).length)d=addDays(d,-1);
  while(medOn(d).length){n++;d=addDays(d,-1)}
  return n;
}
function lastTime(name,before){
  const key=name.trim().toLowerCase(); if(!key)return null;
  const dates=Object.keys(S.workouts).filter(d=>d<before).sort().reverse();
  for(const d of dates){
    const ex=(S.workouts[d].exercises||[]).find(e=>(e.name||'').trim().toLowerCase()===key&&(e.sets||[]).length);
    if(ex)return {date:d,sets:ex.sets};
  }
  return null;
}
function weekStats(mon){
  const dates=[...Array(7)].map((_,i)=>addDays(mon,i));
  const days=dates.map(d=>S.days[d]||{});
  const sessions=dates.map(sessionOf).filter(Boolean).filter(w=>(w.exercises||[]).length);
  const weights=dates.map((d,i)=>num(days[i].weight)).filter(v=>v!=null);
  return {dates,
    kcal:avg(days.map(x=>num(x.kcal))),protein:avg(days.map(x=>num(x.protein))),
    carbs:avg(days.map(x=>num(x.carbs))),fat:avg(days.map(x=>num(x.fat))),
    steps:avg(days.map(x=>num(x.steps))),sleep:avg(days.map(x=>num(x.sleep))),
    stepsArr:days.map(x=>num(x.steps)),kcalArr:days.map(x=>num(x.kcal)),sleepArr:days.map(x=>num(x.sleep)),
    studyArr:dates.map(d=>studyHours(d)),studyTotal:sum(dates.map(studyHours)),
    gym:sessions.length,volume:sum(sessions.map(w=>sum((w.exercises||[]).map(e=>sum((e.sets||[]).map(s=>(s.kg||0)*(s.reps||0))))))),
    medDays:dates.filter(d=>medOn(d).length).length,
    eff:sum(sessions.map(w=>sum((w.exercises||[]).map(e=>(e.sets||[]).filter(x=>setValid(x)&&x.rir!=null&&x.rir<=3).length)))),
    avgRir:avg(sessions.flatMap(w=>(w.exercises||[]).flatMap(e=>(e.sets||[]).filter(x=>setValid(x)&&x.rir!=null).map(x=>x.rir)))),
    w0:weights[0]??null,w1:weights.length?weights[weights.length-1]:null,
    logged:days.filter(x=>Object.keys(x).some(k=>k!=='date'&&x[k]!=null)).length};
}

/* ---------- gráficas ---------- */
const DL=['L','M','M','J','V','S','D'];
function bars(vals,goal,f){
  const W=320,H=120,pt=14,pb=18,n=vals.length,bw=W/n;
  const max=Math.max(goal||0,...vals.map(v=>v||0),1)*1.12;
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Valores por día">';
  s+='<line class="grid" x1="0" x2="'+W+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'"/>';
  if(goal)s+='<line class="goal" x1="0" x2="'+W+'" y1="'+y(goal)+'" y2="'+y(goal)+'"/>';
  vals.forEach((v,i)=>{
    const x=i*bw+bw*.18,w=bw*.64;
    if(v!=null&&v>0)s+='<rect class="bar-r" x="'+x+'" y="'+y(v)+'" width="'+w+'" height="'+(H-pb-y(v))+'" rx="3"/><text x="'+(x+w/2)+'" y="'+(y(v)-3)+'" text-anchor="middle">'+f(v)+'</text>';
    s+='<text x="'+(x+w/2)+'" y="'+(H-5)+'" text-anchor="middle">'+DL[i]+'</text>';
  });
  return s+'</svg>';
}
function weightChart(){
  const pts=Object.entries(S.days).filter(([d,x])=>num(x.weight)!=null).map(([d,x])=>({d,w:x.weight})).sort((a,b)=>a.d<b.d?-1:1).slice(-90);
  if(pts.length<2)return '<p class="empty">Con dos o más pesos registrados aparece la gráfica.</p>';
  const W=320,H=140,pl=34,pr=10,pt=12,pb=20;
  const t0=parse(pts[0].d).getTime(),t1=parse(pts[pts.length-1].d).getTime()||t0+1;
  let lo=Math.min(...pts.map(p=>p.w)),hi=Math.max(...pts.map(p=>p.w));
  if(hi-lo<1){lo-=.5;hi+=.5}
  const pad2=(hi-lo)*.15;lo-=pad2;hi+=pad2;
  const X=d=>pl+(W-pl-pr)*((parse(d).getTime()-t0)/Math.max(1,t1-t0));
  const Y=w=>pt+(H-pt-pb)*(1-(w-lo)/(hi-lo));
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Peso en ayunas">';
  [lo+pad2,hi-pad2].forEach(v=>{s+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(pl-4)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+fmtN(v,1)+'</text>'});
  s+='<polyline class="ln" points="'+pts.map(p=>X(p.d)+','+Y(p.w)).join(' ')+'"/>';
  pts.forEach((p,i)=>{s+='<circle class="dot" cx="'+X(p.d)+'" cy="'+Y(p.w)+'" r="'+(pts.length>30?2:3.5)+'"/>'});
  s+='<text x="'+pl+'" y="'+(H-5)+'">'+shortDate(pts[0].d)+'</text><text x="'+(W-pr)+'" y="'+(H-5)+'" text-anchor="end">'+shortDate(pts[pts.length-1].d)+'</text></svg>';
  return s;
}

function exNames(){

  Object.values(S.workouts).forEach(w=>(w.exercises||[]).forEach(e=>e.name&&set.add(e.name.trim())));
  (S.cfg.routines||[]).forEach(r=>(r.exercises||[]).forEach(n=>n&&set.add(n.trim())));

/* ciencia: e1RM (Epley con RIR), carga, series efectivas e intensidad relativa */
const keyOf=n=>(n||'').trim().toLowerCase();
const setValid=s=>s&&s.kg>0&&s.reps>0;
function setE1rm(s){
  if(!setValid(s))return null;
  const eff=s.reps+(s.rir!=null?s.rir:0);
  return eff<=12?s.kg*(1+eff/30):null;
}
function exMetrics(sets){
  const v=(sets||[]).filter(setValid);
  if(!v.length)return null;
  const e=v.map(setE1rm).filter(x=>x!=null),rirs=v.map(x=>x.rir).filter(x=>x!=null);
  return {e1rm:e.length?Math.max(...e):null,volume:sum(v.map(x=>x.kg*x.reps)),n:v.length,
    eff:v.filter(x=>x.rir!=null&&x.rir<=3).length,avgRir:rirs.length?avg(rirs):null,top:Math.max(...v.map(x=>x.kg)),sets:v};
}
function exHistory(name,upTo){
  const k=keyOf(name),out=[];
  Object.keys(S.workouts).sort().forEach(d=>{
    if(upTo&&d>upTo)return;
    (S.workouts[d].exercises||[]).forEach(e=>{if(keyOf(e.name)===k){const m=exMetrics(e.sets);if(m)out.push({date:d,...m})}});
  });
  let best=0;
  out.forEach(h=>{
    if(h.e1rm!=null)best=Math.max(best,h.e1rm);
    h.best=best||null;
    h.rel=best?avg(h.sets.map(x=>x.kg/best)):null;
  });
  return out;
}
function e1rmChart(h){
  const pts=h.filter(x=>x.e1rm!=null);
  if(pts.length<2)return '<p class="empty">Con 2 sesiones de este ejercicio aparece la gráfica de fuerza.</p>';
  const W=320,H=130,pl=36,pr=14,pt=16,pb=20,n=pts.length;
  let lo=Math.min(...pts.map(p=>p.e1rm)),hi=Math.max(...pts.map(p=>p.e1rm));
  if(hi-lo<2){lo-=1;hi+=1}
  const pd=(hi-lo)*.2;lo-=pd;hi+=pd;
  const X=i=>pl+(W-pl-pr)*(n===1?.5:i/(n-1)),Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Fuerza estimada por sesión">';
  [lo+pd,hi-pd].forEach(v=>{s+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(pl-4)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+fmtN(v,0)+'</text>'});
  s+='<polyline class="ln" points="'+pts.map((p,i)=>X(i)+','+Y(p.e1rm)).join(' ')+'"/>';
  pts.forEach((p,i)=>{s+='<circle class="dot" cx="'+X(i)+'" cy="'+Y(p.e1rm)+'" r="'+(n>24?2:3.5)+'"/>'});
  const l=pts[n-1];
  s+='<text x="'+X(n-1)+'" y="'+(Y(l.e1rm)-8)+'" text-anchor="end">'+fmtN(l.e1rm,1)+' kg</text>';
  s+='<text x="'+pl+'" y="'+(H-5)+'">'+shortDate(pts[0].date)+'</text><text x="'+(W-pr)+'" y="'+(H-5)+'" text-anchor="end">'+shortDate(l.date)+'</text></svg>';
  return s;
}
function loadChart(h){
  const hs=h.slice(-12),W=320,H=130,pt=16,pb=22,n=hs.length,bw=W/Math.max(n,6);
  const max=Math.max(...hs.map(x=>x.volume),1)*1.15,Y=v=>pt+(H-pt-pb)*(1-v/max);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Carga y esfuerzo por sesión"><line class="grid" x1="0" x2="'+W+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'"/>';
  hs.forEach((x,i)=>{
    const bx=i*bw+bw*.15,w=bw*.7,cls=x.avgRir==null?'bar-u':x.avgRir<=3?'bar-r':'bar-m';
    s+='<rect class="'+cls+'" x="'+bx+'" y="'+Y(x.volume)+'" width="'+w+'" height="'+(H-pb-Y(x.volume))+'" rx="3"/>';
    s+='<text x="'+(bx+w/2)+'" y="'+(Y(x.volume)-3)+'" text-anchor="middle">'+(x.volume>=1000?fmtN(x.volume/1000,1)+'k':fmtN(x.volume))+'</text>';
    s+='<text x="'+(bx+w/2)+'" y="'+(H-7)+'" text-anchor="middle">'+(x.avgRir==null?'–':'R'+fmtN(x.avgRir,1))+'</text>';
  });
  return s+'</svg>';
}
function exCard(name){
  const h=exHistory(name);
  if(!h.length)return '<section class="card"><h3>'+esc(name)+'</h3><p class="empty">Todavía no hay series registradas de este ejercicio.</p></section>';
  const l=h[h.length-1],pv=h.length>1?h[h.length-2]:null;
  const bestAll=Math.max(...h.map(x=>x.e1rm||0))||null;
  const dE=l.e1rm!=null&&pv&&pv.e1rm!=null?l.e1rm-pv.e1rm:null;
  return '<section class="card"><div class="row"><h3>'+esc(name)+'</h3><span class="sp"></span><span class="small muted">'+h.length+' '+(h.length===1?'sesión':'sesiones')+'</span></div>'
   +'<div class="mstats"><div class="ms"><b>'+(l.e1rm!=null?fmtN(l.e1rm,1):'—')+'</b><span>e1RM kg</span>'+(dE!=null?'<small class="delta">'+(dE>0?'▲ +':dE<0?'▼ ':'= ')+fmtN(dE,1)+'</small>':'')+'</div>'
   +'<div class="ms"><b>'+(bestAll?fmtN(bestAll,1):'—')+'</b><span>Mejor e1RM</span></div>'
   +'<div class="ms"><b>'+(l.rel!=null?fmtN(l.rel*100,0)+'%':'—')+'</b><span>Intensidad</span></div>'
   +'<div class="ms"><b>'+l.eff+'/'+l.n+'</b><span>Series ≤3 RIR</span></div>'
   +'<div class="ms"><b>'+(l.avgRir!=null?fmtN(l.avgRir,1):'—')+'</b><span>RIR prom.</span></div>'
   +'<div class="ms"><b>'+fmtN(l.top,1)+'</b><span>Peso máx. kg</span></div></div>'
   +'<div class="eyebrow">Fuerza estimada (e1RM) por sesión</div>'+e1rmChart(h)
   +'<div class="eyebrow">Carga (kg × reps) y esfuerzo por sesión</div>'+loadChart(h)
   +'<div class="legend"><span><i style="background:var(--accent)"></i>RIR prom. ≤ 3</span><span><i style="background:#6b6b6b"></i>RIR prom. &gt; 3</span><span><i style="border:1px solid var(--muted)"></i>sin RIR</span></div></section>';
}

function vProgreso(){

  let sel=S.progSel;
  if(!(sel==='otros'||rs.some(r=>r.id===sel)))sel=rs[0]?rs[0].id:'otros';
  const chips='<div class="chips">'+rs.map(r=>'<button class="chip btnchip'+(sel===r.id?' on':'')+'" data-a="prog-sel" data-id="'+esc(r.id)+'">'+esc(r.name)+'</button>').join('')+(others.length?'<button class="chip btnchip'+(sel==='otros'?' on':'')+'" data-a="prog-sel" data-id="otros">Otros</button>':'')+'</div>';
  const names=sel==='otros'?others:((rs.find(r=>r.id===sel)||{}).exercises||[]).filter(Boolean);
  const guide='<details class="card"><summary class="eyebrow" style="cursor:pointer">Cómo leer estas gráficas</summary><div class="small muted" style="margin-top:10px;display:flex;flex-direction:column;gap:8px">'
   +'<p><b style="color:var(--fg)">e1RM (fuerza estimada).</b> Se calcula con la fórmula de Epley usando peso × (1 + (reps + RIR) / 30). Sumar el RIR a las reps estima mejor tu máximo real. Solo cuentan series de hasta 12 reps efectivas, porque más allá la estimación pierde precisión. Lo que importa es la tendencia de varias sesiones, no un solo día.</p>'
   +'<p><b style="color:var(--fg)">Carga y esfuerzo.</b> Cada barra es el volumen de la sesión (kg × reps). Va en dorado cuando el RIR promedio fue 3 o menos, es decir, series cercanas al fallo, que son las que más aportan. En gris, series lejos del fallo. Debajo de cada barra está el RIR promedio.</p>'
   +'<p><b style="color:var(--fg)">Intensidad.</b> Es el peso que usaste, en promedio, como porcentaje de tu mejor e1RM registrado hasta ese día.</p>'
   +'<p><b style="color:var(--fg)">Series ≤3 RIR.</b> Cuántas series terminaste cerca del fallo, sobre el total de series.</p></div></details>';
  return '<section class="card"><h3>Progreso por ejercicio</h3>'+(rs.length||others.length?chips:'<p class="empty">Primero define tus rutinas en la pestaña Rutinas y registra tus sesiones.</p>')+'</section>'
   +(names.length?names.map(exCard).join(''):(rs.length||others.length?'<p class="empty">Esta rutina todavía no tiene ejercicios.</p>':''))
   +(names.length||rs.length||others.length?guide:'');
}

/* --- estudio --- */
function vEstudio(){

   +(en.length?'<div class="list">'+en.map((e,i)=>'<div class="li"><span class="nm">'+esc(e.subject)+'</span><span class="mono">'+fmtN(e.hours,2)+' h</span><button class="x" data-a="st-del" data-i="'+i+'" aria-label="Quitar">'+ICON.x+'</button></div>').join('')+'</div>':'<p class="empty">Aún no registras horas este día.</p>')

   +'<label class="fld"><span>Horas</span><div class="in"><input id="st_hrs" type="number" inputmode="decimal" step="0.25" min="0" placeholder="1.5"><em>h</em></div></label></div>'
   +'<datalist id="sublist">'+subjList.map(s=>'<option value="'+esc(s)+'">').join('')+'</datalist>'
   +'<button class="btn" data-a="st-add">Añadir</button></section>'
   +'<section class="card"><div class="row"><h3>Esta semana por materia</h3><span class="sp"></span><span class="mono small muted">'+fmtN(sum(Object.values(bySubj)),1)+' h</span></div>'+(wk||'<p class="empty">Cuando registres horas, aquí ves cuánto va cada materia.</p>')+'</section>';

/* --- semana --- */
function dlt(cur,prev,dec,unit){
  if(cur==null||prev==null)return '';
  const x=cur-prev;if(Math.abs(x)<Math.pow(10,-(dec||0))/2)return '<span class="delta">= semana previa</span>';
  return '<span class="delta">'+(x>0?'▲ +':'▼ ')+fmtN(x,dec)+unit+' vs previa</span>';
}
function vSemana(){
  const mon=S.weekSel,st=weekStats(mon),pv=weekStats(addDays(mon,-7)),g=S.cfg;
  const ob=S.weeks[mon]||{};
  const cur=mon===monday(todayStr());
  const wd=st.w0!=null&&st.w1!=null?st.w1-st.w0:null;
  const stat=(l,v,u,sub)=>'<div class="stat"><span class="eyebrow">'+l+'</span><div class="v">'+v+(u?' <small>'+u+'</small>':'')+'</div>'+(sub||'')+'</div>';
  const obsHtml=(ob.summary||(ob.wins&&ob.wins.length)||(ob.focus&&ob.focus.length))
    ?(ob.summary?'<p class="pre">'+esc(ob.summary)+'</p>':'')
     +(ob.wins&&ob.wins.length?'<div><div class="eyebrow">Lo que salió bien</div><ul>'+ob.wins.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>':'')
     +(ob.focus&&ob.focus.length?'<div><div class="eyebrow">Para la próxima semana</div><ul>'+ob.focus.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>':'')
    :'<p class="empty">Todavía no hay observaciones de esta semana. Toca «Copiar resumen para Claude», pégalo en el chat con Claude y luego importa lo que te devuelva en Ajustes.</p>';
  return '<div class="datebar"><button data-a="wprev" aria-label="Semana anterior">'+ICON.prev+'</button><div class="mid"><b>'+shortDate(mon)+' – '+shortDate(addDays(mon,6))+'</b>'+(cur?'<span class="small muted">Esta semana</span>':'<a data-a="wnow">Ir a esta semana</a>')+'</div><button data-a="wnext" aria-label="Semana siguiente"'+(cur?' disabled style="opacity:.3"':'')+'>'+ICON.next+'</button></div>'
   +'<section class="card obs"><h3>Observaciones de Claude</h3>'+obsHtml+(ob.updatedAt?'<p class="small muted">Actualizado el '+esc(ob.updatedAt)+'</p>':'')+'</section>'
   +'<section class="card"><div class="row wrapr"><button class="btn ghost sm" data-a="wcopy">Copiar resumen para Claude</button></div></section>'
   +'<div class="stats">'
   +stat('Peso en ayunas',st.w1!=null?fmtN(st.w1,1):'—','kg',wd!=null?'<span class="delta">'+(wd>0?'▲ +':wd<0?'▼ ':'= ')+fmtN(wd,1)+' en la semana</span>':'')
   +stat('Calorías prom.',fmtN(st.kcal),'kcal',dlt(st.kcal,pv.kcal,0,''))
   +stat('Proteína prom.',fmtN(st.protein),'g',dlt(st.protein,pv.protein,0,' g'))
   +stat('Carbos / grasa',fmtN(st.carbs)+' / '+fmtN(st.fat),'g','')
   +stat('Pasos prom.',fmtN(st.steps),'',dlt(st.steps,pv.steps,0,''))
   +stat('Sueño prom.',fmtN(st.sleep,1),'h',dlt(st.sleep,pv.sleep,1,' h'))
   +stat('Estudio',fmtN(st.studyTotal,1),'h',dlt(st.studyTotal,pv.studyTotal,1,' h'))
   +stat('Gym',st.gym,'sesiones',st.volume?'<span class="delta">'+fmtN(st.volume)+' kg de volumen</span>':'')
   +stat('Series ≤3 RIR',st.eff,'series','')
   +stat('RIR promedio',fmtN(st.avgRir,1),'',dlt(st.avgRir,pv.avgRir,1,''))
   +stat('Medicina',st.medDays+'/7','días','')
   +stat('Días registrados',st.logged+'/7','','')
   +'</div>'
   +'<section class="card"><h3>Pasos por día</h3><span class="small muted">Línea punteada: meta de '+fmtN(g.steps)+'</span>'+bars(st.stepsArr,g.steps,v=>fmtN(v/1000,1)+'k')+'</section>'
   +'<section class="card"><h3>Calorías por día</h3><span class="small muted">Línea punteada: meta de '+fmtN(g.kcal)+' kcal</span>'+bars(st.kcalArr,g.kcal,v=>fmtN(v))+'</section>'
   +'<section class="card"><h3>Horas de estudio por día</h3><span class="small muted">Línea punteada: meta de '+fmtN(g.study,1)+' h</span>'+bars(st.studyArr,g.study,v=>fmtN(v,1))+'</section>'
   +'<section class="card"><h3>Peso en ayunas</h3>'+weightChart()+'</section>';
}

/* ---------- render ---------- */
function render(){
  const app=$('#app');
  $('#nav').innerHTML=TABS.map(t=>'<button data-a="tab" data-t="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'" aria-label="'+t[1]+'"'+(S.tab===t[0]?' aria-current="page"':'')+'>'+ICON[t[0]==='med'?'med':t[0]]+'<span>'+t[1]+'</span></button>').join('');
  const head='<div class="top"><div><div class="eyebrow">Bitácora</div><h1>Hola, Velez</h1></div><button class="iconbtn" data-a="tab" data-t="ajustes" aria-label="Ajustes">'+ICON.gear+'</button></div>';
  if(S.offline){app.innerHTML=head+'<section class="card"><h3>No puedo guardar tus datos</h3><p class="muted">Esta página necesita abrirse con tu sesión de Claude iniciada para usar su base de datos. Abre el enlace desde Safari con tu cuenta iniciada.</p></section>';return}
  if(S.loaded<TOTAL_SUBS){app.innerHTML=head+'<section class="card"><p class="muted"><span class="spin"></span> Cargando tus datos…</p></section>';return}
  const v={hoy:vHoy,gym:vGym,estudio:vEstudio,med:vMed,semana:vSemana,ajustes:vAjustes}[S.tab]||vHoy;
  app.innerHTML=head+v();
  tick();
}
let dirty=false;
function typing(){const a=document.activeElement;return a&&$('#app').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)}
function scheduleRender(){if(typing()){dirty=true;return}requestAnimationFrame(render)}
document.addEventListener('focusout',()=>{if(dirty){setTimeout(()=>{if(!typing()){dirty=false;render()}},60)}});

/* ---------- acciones ---------- */
function ensureW(){
  const w=S.workouts[S.date]?clone(S.workouts[S.date]):{date:S.date,title:'',minutes:0,exercises:[]};
  w.exercises=w.exercises||[];return w;
}
function commitW(w,redraw){S.workouts[S.date]=w;saveDoc('workouts',S.date);if(redraw)render()}

document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,ds=b.dataset;
  switch(a){
    case 'tab':S.tab=ds.t;render();window.scrollTo(0,0);break;
    case 'dprev':S.date=addDays(S.date,-1);render();break;
    case 'dnext':if(S.date<todayStr()){S.date=addDays(S.date,1);render()}break;
    case 'dtoday':S.date=todayStr();render();break;
    case 'wprev':S.weekSel=addDays(S.weekSel,-7);render();break;
    case 'wnext':if(S.weekSel<monday(todayStr())){S.weekSel=addDays(S.weekSel,7);render()}break;
    case 'wnow':S.weekSel=monday(todayStr());render();break;
    /* gym */
    case 'gview':S.gymView=ds.v;render();break;
    case 'prog-sel':S.progSel=ds.id;render();break;
    case 'rt-load':{
      const r=(S.cfg.routines||[]).find(x=>x.id===ds.id);if(!r)break;
      const w=ensureW();w.routineId=r.id;if(!w.title)w.title=r.name;
      (r.exercises||[]).forEach(n=>{
        if(!n||!n.trim())return;
        if(!w.exercises.some(e=>keyOf(e.name)===keyOf(n)))w.exercises.push({name:n.trim(),sets:[{kg:null,reps:null,rir:null},{kg:null,reps:null,rir:null},{kg:null,reps:null,rir:null}]});
      });
      commitW(w,true);toast('Rutina «'+r.name+'» cargada');break}
    case 'rt-add':{const c=clone(S.cfg.routines||[]);c.push({id:'r'+Date.now(),name:'',exercises:['']});S.cfg={...S.cfg,routines:c};saveCfg();render();break}
    case 'rt-ex-add':{const c=clone(S.cfg.routines||[]);c[+ds.ri].exercises.push('');S.cfg={...S.cfg,routines:c};saveCfg();render();break}
    case 'rt-ex-del':{const c=clone(S.cfg.routines||[]);c[+ds.ri].exercises.splice(+ds.ei,1);S.cfg={...S.cfg,routines:c};saveCfg();render();break}
    case 'rt-del':{
      if(ds.confirm!=='1'){b.dataset.confirm='1';b.textContent='¿Seguro? Toca otra vez';break}
      const c=clone(S.cfg.routines||[]);c.splice(+ds.ri,1);S.cfg={...S.cfg,routines:c};saveCfg();render();break}
    case 'gex-add':{const w=ensureW();w.exercises.push({name:'',sets:[{kg:null,reps:null,rir:null}]});commitW(w,true);break}
    case 'gex-del':{const w=ensureW();w.exercises.splice(+ds.ei,1);commitW(w,true);break}
    case 'gset-add':{const w=ensureW(),e=w.exercises[+ds.ei],l=e.sets[e.sets.length-1];e.sets.push({kg:l?l.kg:null,reps:l?l.reps:null,rir:l?l.rir:null});commitW(w,true);break}
    case 'gset-del':{const w=ensureW();w.exercises[+ds.ei].sets.splice(+ds.si,1);commitW(w,true);break}
    case 'rest':{
      const s=+ds.s;
      if(!T.audio){try{T.audio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
      try{T.audio&&T.audio.resume()}catch(e){}
      const box=$('#restBox');box&&box.classList.remove('done');
      T.restEnd=s?Date.now()+s*1000:0;T.restTotal=s;tick();break}
    case 'sw':{
      const sw=lsGet('velez.sw');
      if(!sw){lsSet('velez.sw',{start:Date.now()});render();break}
      const m=Math.max(1,Math.round((Date.now()-sw.start)/60000));
      lsSet('velez.sw',null);
      const w=ensureW();w.minutes=(w.minutes||0)+m;commitW(w,true);toast('Se sumaron '+m+' min');break}
    /* estudio */
    case 'st-add':{
      const subj=($('#st_subj').value||'').trim(),h=parseFloat($('#st_hrs').value);
      if(!subj||!(h>0)){toast('Escribe la materia y las horas');break}
      const cur=S.study[S.date]?clone(S.study[S.date]):{date:S.date,entries:[]};
      const hit=cur.entries.find(e=>e.subject.toLowerCase()===subj.toLowerCase());
      if(hit)hit.hours=Math.round((hit.hours+h)*100)/100;else cur.entries.push({subject:subj,hours:h});
      S.study[S.date]=cur;saveDoc('study',S.date);
      if(!(S.cfg.subjects||[]).some(s=>s.toLowerCase()===subj.toLowerCase())){S.cfg={...S.cfg,subjects:[...(S.cfg.subjects||[]),subj]};saveCfg()}
      render();break}
    case 'st-del':{const cur=clone(S.study[S.date]);cur.entries.splice(+ds.i,1);S.study[S.date]=cur;saveDoc('study',S.date);render();break}
    /* medicina */
    case 'med-send':sendMed();break;
    /* ajustes */
    case 'subj-add':{const v=($('#subj_new').value||'').trim();if(!v)break;S.cfg={...S.cfg,subjects:[...(S.cfg.subjects||[]),v]};saveCfg();render();break}
    case 'subj-del':{const l=[...(S.cfg.subjects||[])];l.splice(+ds.i,1);S.cfg={...S.cfg,subjects:l};saveCfg();render();break}
    case 'export':downloadJSON();break;
    case 'copyall':copyText(JSON.stringify(exportObj(false)),'Copia todo este texto');break;
    case 'import-open':showSheet({title:'Importar datos',hint:'Pega aquí el JSON que te dio Claude.',action:'Importar',placeholder:'{"days":{...}}',onGo:async t=>{if(await importJSON(t))closeSheet()}});break;
    case 'wcopy':copyText(weekText(S.weekSel),'Copia todo este texto');break;
    case 'rev-copy':copyText(medPrompt(S.med[ds.id]),'Copia todo este texto');break;
    case 'rev-save':{
      const ta=document.getElementById('rev_'+ds.id),t=ta&&ta.value.trim();
      if(!t){toast('Pega primero la revisión');break}
      const m=clone(S.med[ds.id]);m.feedback=t;S.med[ds.id]=m;await saveDoc('med',ds.id);medUI.open=ds.id;toast('Revisión guardada');render();break}
    case 'med-del':{if(ds.confirm!=='1'){b.dataset.confirm='1';b.textContent='¿Borrar? Toca otra vez';b.classList.add('btn','ghost','sm');break}
      delete S.med[ds.id];await db.doc('med/'+ds.id).delete();render();break}
    case 'sheet-close':closeSheet();break;
    case 'sheet-go':{const f=S.sheetGo,ta=document.getElementById('sheet_ta');if(f&&ta)f(ta.value);break}
  }
});

  }else if(f==='cfg'){
    const v=el.value===''?null:Number(el.value);
    S.cfg={...S.cfg,[el.dataset.k]:v};saveCfg();
  }else if(f==='gym'){
    const w=ensureW(),g=el.dataset.g;
    if(g==='title')w.title=el.value;
    else if(g==='minutes')w.minutes=el.value===''?0:Number(el.value);
    else{
      const e=w.exercises[+el.dataset.ei];if(!e)return;
      if(g==='name'){e.name=el.value;commitW(w,false);scheduleRender();return}
      const s=e.sets[+el.dataset.si];s[g]=el.value===''?null:Number(el.value);
    }
    commitW(w,false);
  }else if(f==='rt'){
    const c=clone(S.cfg.routines||[]),r=c[+el.dataset.ri];if(!r)return;
    if(el.dataset.k==='name')r.name=el.value.trim();else r.exercises[+el.dataset.ei]=el.value.trim();
    S.cfg={...S.cfg,routines:c};saveCfg();
  }else if(f==='mdfile'){
    const file=el.files&&el.files[0],note=document.getElementById('md_imgnote');
    if(!file){medDraft.image=null;if(note)note.textContent='';return}
    if(note)note.textContent='Procesando…';
    shrinkImage(file).then(u=>{medDraft.image=u;if(note)note.textContent='✓ Imagen lista'}).catch(()=>{medDraft.image=null;if(note)note.textContent='No pude leer esa imagen. Prueba con otra o pega el texto.'});
  }else if(f==='impfile'){
    const file=el.files&&el.files[0];if(file)file.text().then(importJSON);
    el.value='';
  }
});
document.addEventListener('input',ev=>{
  const el=ev.target;if(el.dataset&&el.dataset.f==='md')medDraft[el.dataset.m]=el.value;
});

/* ---------- medicina: guardar ---------- */
function shrinkImage(file,max=1100){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.72))};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};
    img.src=url;
  });
}
async function sendMed(){
  const dr=medDraft;medUI.err='';
  if(!dr.topic.trim()){medUI.err='Escribe el tema que estudiaste.';return render()}
  if(!dr.image&&dr.source.trim().length<20){medUI.err='Sube una imagen o pega un texto de al menos unas líneas. Es obligatorio.';return render()}
  if(dr.explanation.trim().length<80){medUI.err='Explícalo con más detalle (mínimo unas 3 o 4 frases).';return render()}
  const now=Date.now(),id=todayStr()+'_'+now;
  S.med[id]={date:todayStr(),topic:dr.topic.trim(),source:dr.source.trim(),explanation:dr.explanation.trim(),feedback:'',image:dr.image||null,createdAt:now};
  await saveDoc('med',id);
  dr.topic='';dr.source='';dr.explanation='';dr.image=null;medUI.open=id;
  toast('Guardado. Copia el estudio para que Claude lo revise.');
  render();
}
function medPrompt(m){
  return 'Revisa mi estudio de medicina de hoy como un tutor exigente pero amable.\n\nTema: '+m.topic+'\n'
   +(m.source?'\nMaterial:\n'+m.source+'\n':'')+(m.image?'\n(Te adjunto una foto del material.)\n':'')
   +'\nMi explicación:\n'+m.explanation+'\n\nDame: nota X/10, lo que está bien, correcciones, lo que falta y 2 preguntas de repaso. Máximo 250 palabras y sin consejos clínicos para pacientes reales.';
}

/* ---------- copiar, hoja y datos ---------- */
function closeSheet(){const el=document.getElementById('sheet');if(el)el.remove();S.sheetGo=null}
function showSheet(o){
  closeSheet();
  const el=document.createElement('div');el.id='sheet';el.className='sheet';
  el.innerHTML='<div class="sbox"><h3>'+esc(o.title)+'</h3>'+(o.hint?'<p class="small muted">'+esc(o.hint)+'</p>':'')
   +'<textarea id="sheet_ta"'+(o.readonly?' readonly':'')+' placeholder="'+esc(o.placeholder||'')+'">'+esc(o.text||'')+'</textarea>'
   +'<div class="row">'+(o.action?'<button class="btn" data-a="sheet-go">'+esc(o.action)+'</button>':'')+'<button class="btn ghost" data-a="sheet-close">Cerrar</button></div></div>';
  document.body.appendChild(el);S.sheetGo=o.onGo||null;
  const ta=document.getElementById('sheet_ta');ta.focus();if(o.readonly)ta.select();
}
async function copyText(t,title){
  try{await navigator.clipboard.writeText(t);toast('Copiado. Pégalo en el chat con Claude.');return}catch(e){}
  showSheet({title:title||'Copia este texto',text:t,readonly:true});
}
function exportObj(withImages){
  const med={};Object.entries(S.med).forEach(([k,m])=>{const c={...m};if(!withImages)delete c.image;med[k]=c});
  return {version:1,days:S.days,workouts:S.workouts,study:S.study,med,weeks:S.weeks,cfg:S.cfg};
}
function downloadJSON(){
  const blob=new Blob([JSON.stringify(exportObj(true))],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='bitacora-velez-'+todayStr()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function importJSON(txt){
  let o;try{o=JSON.parse(txt)}catch(e){toast('Eso no es un JSON válido');return false}
  if(!o||typeof o!=='object'){toast('Eso no es un JSON válido');return false}
  let n=0;
  for(const coll of ['days','workouts','study','med','weeks']){
    const src=o[coll];if(!src||typeof src!=='object')continue;
    for(const [id,v] of Object.entries(src)){
      if(!/^[A-Za-z0-9_.\-]{1,80}$/.test(id)||!v||typeof v!=='object')continue;
      S[coll][id]=(coll==='days'||coll==='weeks')?{...(S[coll][id]||{}),...v}:v;
      if(coll==='days')S.days[id].date=id;
      await saveDoc(coll,id);n++;
    }
  }
  if(o.cfg&&typeof o.cfg==='object'){S.cfg={...S.cfg,...o.cfg};await saveCfg();n++}
  toast(n?n+' registros importados':'No encontré datos para importar');render();return n>0;
}
function weekText(mon){
  const st=weekStats(mon),g=S.cfg,out=[];
  out.push('Resumen de mi semana del '+mon+' al '+addDays(mon,6)+'. Escribe tus observaciones para mejorar la próxima semana y devuélvemelas en este formato JSON para importarlo en mi app:');
  out.push('{"weeks":{"'+mon+'":{"summary":"...","wins":["..."],"focus":["..."],"updatedAt":"'+todayStr()+'"}}}');
  out.push('');
  out.push('Metas diarias: '+g.kcal+' kcal, '+g.protein+' g proteína, '+g.steps+' pasos, '+g.sleep+' h sueño, '+g.study+' h estudio.');
  out.push('');
  st.dates.forEach(d=>{
    const x=S.days[d]||{},w=S.workouts[d],ml=medOn(d);
    const gy=w&&(w.exercises||[]).length?(w.title||'Gym')+' ('+(w.minutes||0)+' min): '+w.exercises.map(e=>(e.name||'?')+' '+(e.sets||[]).filter(s=>s.kg!=null||s.reps!=null).map(s=>(s.kg??'?')+'x'+(s.reps??'?')+(s.rir!=null?' @'+s.rir+'RIR':'')).join(', ')).join('; '):'sin gym';
    const sb=((S.study[d]||{}).entries||[]).map(e=>e.subject+' '+e.hours+' h').join(', ')||'sin estudio';
    out.push(d+': peso '+(x.weight??'—')+' kg; '+(x.kcal??'—')+' kcal (P '+(x.protein??'—')+' / C '+(x.carbs??'—')+' / G '+(x.fat??'—')+'); pasos '+(x.steps??'—')+'; sueño '+(x.sleep??'—')+' h; '+sb+'; '+gy+'; medicina: '+(ml.map(m=>m.topic).join(', ')||'no'));
  });
  const names=new Set();
  st.dates.forEach(d=>((S.workouts[d]||{}).exercises||[]).forEach(e=>e.name&&names.add(e.name.trim())));
  if(names.size){
    out.push('');out.push('Ejercicios de la semana (RIR = repeticiones en reserva; e1RM = fuerza estimada con Epley usando reps + RIR):');
    names.forEach(n=>{
      const h=exHistory(n),wk=h.filter(x=>x.date>=mon&&x.date<=addDays(mon,6)),pr=h.filter(x=>x.date<mon);
      if(!wk.length)return;
      const bw=Math.max(...wk.map(x=>x.e1rm||0))||null,bp=pr.length?(Math.max(...pr.map(x=>x.e1rm||0))||null):null;
      out.push('- '+n+': e1RM '+(bw?fmtN(bw,1):'—')+' kg (mejor previo '+(bp?fmtN(bp,1):'—')+'), series ≤3 RIR '+sum(wk.map(x=>x.eff))+'/'+sum(wk.map(x=>x.n))+', RIR prom. '+fmtN(avg(wk.map(x=>x.avgRir)),1)+', carga '+fmtN(sum(wk.map(x=>x.volume)))+' kg');
    });
  }
  return out.join('\n');
}

/* ---------- almacenamiento local (sin internet) ---------- */
const Store=(function(){
  const mem={},subs={};let idb=null;
  const open=()=>new Promise(res=>{try{const r=indexedDB.open('bitacora-velez',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}});
  async function init(){
    idb=await open();
    if(idb){
      await new Promise(res=>{const rq=idb.transaction('docs').objectStore('docs').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){mem[c.key]=c.value;c.continue()}else res()};rq.onerror=()=>res()});
    }else{try{Object.assign(mem,JSON.parse(localStorage.getItem('velez.docs')||'{}'))}catch(e){}}
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  }
  function persist(path,val){
    if(idb)return new Promise((res,rej)=>{const tx=idb.transaction('docs','readwrite');val===undefined?tx.objectStore('docs').delete(path):tx.objectStore('docs').put(val,path);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)});
    try{localStorage.setItem('velez.docs',JSON.stringify(mem))}catch(e){return Promise.reject(e)}
    return Promise.resolve();
  }
  const snap=coll=>({docs:Object.keys(mem).filter(k=>k.startsWith(coll+'/')).map(k=>({id:k.slice(coll.length+1),data:()=>mem[k]}))});
  const notify=coll=>(subs[coll]||[]).forEach(cb=>cb(snap(coll)));
  return {init,
    doc:path=>({
      set:async data=>{mem[path]=clone(data);await persist(path,mem[path]);notify(path.split('/')[0])},
      delete:async()=>{delete mem[path];await persist(path,undefined);notify(path.split('/')[0])}}),
    collection:name=>({onSnapshot:next=>{(subs[name]=subs[name]||[]).push(next);Promise.resolve().then(()=>next(snap(name)));return ()=>{}}})};
})();

/* ---------- arranque ---------- */
function sub(name,key){
  db.collection(name).onSnapshot(snap=>{
    const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});
    if(name==='config'){S.cfg={...DEF_CFG,...(o.main||{})}}else{S[key]=o}
    if(!sub.seen[name]){sub.seen[name]=1;S.loaded++}
    scheduleRender();
  });
}
sub.seen={};
render();
(async()=>{
  try{await Store.init()}catch(e){console.error(e)}
  db=Store;
  sub('days','days');sub('workouts','workouts');sub('study','study');sub('med','med');sub('weeks','weeks');sub('config','cfg');
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
})();
